services:
  backend1:
    build:
      context: ./BackendApi1
      dockerfile: Dockerfile
    restart: unless-stopped

  backend2:
    build:
      context: ./BackendApi2
      dockerfile: Dockerfile
    restart: unless-stopped

  backend3:
    build:
      context: ./BackendApi3
      dockerfile: Dockerfile
    restart: unless-stopped

  loadbalancer:
    build:
      context: ./LoadBalancerApi
      dockerfile: Dockerfile
    ports:
      - "7073:8080"
    environment:
      - BACKEND1_URL=http://backend1:8080
      - BACKEND2_URL=http://backend2:8080
      - BACKEND3_URL=http://backend3:8080
    depends_on:
      - backend1
      - backend2
      - backend3
    restart: unless-stopped
